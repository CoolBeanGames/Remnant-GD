<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexicon / Story authoring</title>
<style>
:root{--paper:#e8e4d8;--ink:#22261f;--line:#acae9e;--rust:#9d3d22;--muted:#60665b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:baseline;padding:22px 30px;border-bottom:2px solid var(--ink)}h1{margin:0;letter-spacing:-2px;font-size:38px}.stamp,label,.tabs,button,.status{font:12px Consolas,monospace;letter-spacing:.6px}header p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:8px;padding:16px 30px;border-bottom:1px solid var(--line);align-items:center}.toolbar input{flex:1;min-width:80px}input,select,textarea{font:16px Arial,sans-serif;border:1px solid var(--line);padding:11px;background:#f6f2e7;color:var(--ink);max-width:100%}textarea{resize:vertical;min-height:170px;line-height:1.5}button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:12px 16px;cursor:pointer}button:hover,button.active{background:var(--ink);color:var(--paper)}button.primary{background:var(--ink);color:var(--paper)}button:disabled{opacity:.4;cursor:default}button.danger{color:var(--rust);border-color:var(--rust)}.tabs{display:flex;padding:0 30px;border-bottom:1px solid var(--ink)}.tabs button{border:0;border-right:1px solid var(--line);padding:18px 28px}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 240px)}aside{padding:24px;border-right:1px solid var(--line)}.list-actions{display:flex;gap:6px;margin:12px 0}aside input{width:100%}.entries{display:grid;gap:0}.entry{text-align:left;border:0;border-bottom:1px solid var(--line);padding:16px 8px;font:16px Arial,sans-serif}.entry small{display:block;font:11px Consolas,monospace;color:var(--muted);margin-top:5px}.entry.active small{color:var(--paper)}main{padding:28px 36px;min-width:0;max-width:1300px}.empty{padding:50px 0;color:var(--muted);font-size:24px;max-width:540px;line-height:1.4}.form{display:grid;gap:20px}.field{display:grid;gap:7px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row .field{flex:1;min-width:150px}.image{max-height:360px;max-width:100%;object-fit:contain;align-self:start}audio{max-width:100%;height:36px}.line-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;border-top:1px solid var(--ink);padding-top:22px}.line-list{display:grid;gap:0;align-content:start}.line-list button{border:0;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}.choices{display:grid;gap:10px}.choice{display:grid;grid-template-columns:minmax(80px,1fr) minmax(100px,180px) auto;gap:8px}h2{font-size:28px;margin:0 0 18px;letter-spacing:-.5px}h3{font-size:18px;margin:20px 0 8px}.field,.form,.line-list,.choice>*{min-width:0}.fine{overflow-wrap:anywhere;font-size:13px;color:var(--muted);line-height:1.5}.status{padding:12px 30px;background:var(--ink);color:var(--paper);min-height:42px;position:sticky;bottom:0}.status.error{background:var(--rust)}[hidden]{display:none!important}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font:12px Consolas,monospace}dialog{background:var(--paper);color:var(--ink);border:2px solid var(--ink);width:min(720px,90vw);max-height:88vh;padding:32px}dialog::backdrop{background:#0009}.preview-text{font-size:22px;line-height:1.6;white-space:pre-wrap}.preview-choices{display:grid;gap:10px;margin-top:20px}#preview-image{max-width:100%;max-height:50vh;object-fit:contain}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--rust);outline-offset:2px}@media(max-width:850px){.workspace{grid-template-columns:210px minmax(0,1fr)}main{padding:24px}.line-layout{grid-template-columns:1fr}.line-list{display:flex;flex-wrap:wrap}.toolbar{flex-wrap:wrap}}@media(max-width:600px){header{padding:18px;display:block}.toolbar,.tabs{padding:12px}.tabs button{padding:14px 16px}.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.entries{max-height:200px;overflow:auto}.line-layout{gap:20px}main{padding:20px}.choice{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body>
<header><h1>LEXICON</h1><p class="stamp">NOTES / DIALOG / FLAVOR</p></header>
<div class="toolbar"><input id="project" aria-label="Godot project folder" placeholder="Choose a Godot project folder"><button id="browse">BROWSE</button><button id="open">OPEN</button><button id="save" class="primary">SAVE + EXPORT</button><button id="close">EXIT TOOL</button></div>
<nav class="tabs" aria-label="Content types"><button data-kind="notes" class="active">NOTES</button><button data-kind="dialog">DIALOG</button><button data-kind="flavor">FLAVOR</button></nav>
<div class="workspace"><aside><label for="search">MASTER LIST</label><input id="search" type="search" placeholder="Find a name or ID"><div class="list-actions"><button id="new">+ NEW</button><button id="delete" class="danger">REMOVE</button></div><div id="entries" class="entries"></div></aside><main id="editor"></main></div>
<div id="status" class="status" role="status">Open a project to begin.</div>
<dialog id="preview"><div class="row"><h2 id="preview-title"></h2><button id="preview-close">CLOSE</button></div><img id="preview-image" alt="Note image" hidden><p id="preview-speaker" class="stamp"></p><div id="preview-text" class="preview-text"></div><audio id="preview-audio" controls hidden></audio><div id="preview-choices" class="preview-choices"></div><button id="preview-next">NEXT LINE</button></dialog>
<script>
'use strict';
const token=new URLSearchParams(location.search).get('session');
let state={database:{version:1,notes:[],dialog:[],flavor:[]},revision:0,project:''},kind='notes',selected='',lineIndex=0,dirty=false,busy=false,previewEntry=null,previewLine=null,previewIndex=0;
const el=id=>document.getElementById(id),entries=()=>state.database[kind],entry=()=>entries().find(x=>x.id===selected);
async function api(route,body){const response=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{'X-Lexicon-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result}
function status(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error)}
function changed(){dirty=true;el('save').textContent='SAVE + EXPORT *';status('Unsaved changes. Ctrl+S saves the library and Godot resources.');renderList();const row=entry();if(row?.lines){document.querySelectorAll('.line-list button').forEach((b,index)=>b.textContent=(index+1)+'. '+(row.lines[index]?.text||'(empty)').slice(0,45));document.querySelectorAll('#editor select option').forEach(o=>{const line=row.lines.find(x=>x.id===o.value);if(line)o.textContent=line.id+' / '+(line.text||'(empty)').slice(0,35)})}}
function button(text,action,css=''){const b=document.createElement('button');b.textContent=text;b.className=css;b.type='button';b.onclick=action;return b}
function field(label,control){const wrap=document.createElement('label');wrap.className='field';const title=document.createElement('span');title.textContent=label;wrap.append(title,control);return wrap}
function input(value,oninput,multiline=false){const n=document.createElement(multiline?'textarea':'input');n.value=value||'';n.addEventListener('input',()=>{oninput(n.value);changed()});return n}
function selectLine(value,onchange,source=entry()){const n=document.createElement('select');n.add(new Option('End', ''));for(const line of source.lines||[])n.add(new Option(line.id+' / '+(line.text||'(empty)').slice(0,35),line.id));n.value=value||'';n.onchange=()=>{onchange(n.value);changed()};return n}
function mediaURL(path){return '/api/media?session='+encodeURIComponent(token)+'&path='+encodeURIComponent(path)}
function renderList(){el('entries').replaceChildren();const query=el('search').value.toLowerCase();for(const row of entries().filter(x=>(x.title+' '+x.id).toLowerCase().includes(query))){const b=button(row.title,()=>{selected=row.id;lineIndex=0;render()},'entry'+(row.id===selected?' active':''));const small=document.createElement('small');small.textContent=row.id;b.append(small);el('entries').append(b)}el('delete').disabled=!entry();el('new').disabled=!state.project}
function render(){renderList();el('editor').replaceChildren();const row=entry();if(!row){const empty=document.createElement('p');empty.className='empty';empty.textContent=state.project?'Select an entry, or create one. Names, words, images and voices stay together.':'Open the folder containing project.godot. Lexicon maintains the three catalogs and copies its plugin into that project.';el('editor').append(empty);return}const form=document.createElement('div');form.className='form';form.append(field('NAME',input(row.title,value=>row.title=value)));const top=document.createElement('div');top.className='row';top.append(button('PREVIEW',()=>showPreview(row)));const identity=document.createElement('details');const summary=document.createElement('summary');summary.textContent='RESOURCE ID / ADVANCED';identity.append(summary);const idInput=input(row.id,value=>{row.id=value;selected=value});idInput.addEventListener('change',render);identity.append(field('Keep this ID stable after using it in a game.',idInput));form.append(top,identity);if(kind==='notes'){form.append(field('TEXT / TRANSCRIPT',input(row.text,value=>row.text=value,true)),assetControl(row,'image'));if(row.image){const image=document.createElement('img');image.className='image';image.alt='Note preview';image.src=mediaURL(row.image);form.append(image)}}else{if(kind==='dialog')form.append(field('STARTING LINE',selectLine(row.start_line,value=>row.start_line=value)));form.append(linesEditor(row))}el('editor').append(form)}
function assetControl(owner,key){const wrap=document.createElement('div');const controls=document.createElement('div');controls.className='row';const picker=document.createElement('input');picker.type='file';picker.accept=key==='image'?'.png,.jpg,.jpeg,.webp':'.wav,.ogg,.mp3';picker.setAttribute('aria-label',key==='image'?'Upload note image':'Upload voice clip');picker.onchange=async()=>{try{const file=picker.files[0];if(!file)return;const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const result=await api('upload',{name:file.name,data});owner[key]=result.path;changed();render()}catch(error){status(error.message,true)}};controls.append(picker,button('CLEAR',()=>{owner[key]='';changed();render()}));wrap.append(field(key==='image'?'IMAGE':'OPTIONAL VOICE',controls));if(key==='audio'&&owner[key]){const audio=document.createElement('audio');audio.controls=true;audio.src=mediaURL(owner[key]);wrap.append(audio)}const caption=document.createElement('p');caption.className='fine';caption.textContent=owner[key]?owner[key].split(/[\\/]/).pop():'No file assigned.';wrap.append(caption);return wrap}
function newID(prefix,rows){let i=1;while(rows.some(x=>x.id.toLowerCase()===prefix+i))i++;return prefix+i}
function makeLine(rows){return {id:newID('line_',rows),speaker:'',text:'',audio:'',next:'',choices:[]}}
function addLine(row){const previous=row.lines.at(-1),line=makeLine(row.lines);if(kind==='dialog'){if(previous&&!previous.next&&!previous.choices.length)previous.next=line.id;if(!row.start_line)row.start_line=line.id}row.lines.push(line);lineIndex=row.lines.length-1;changed();render()}
function removeLine(row){const line=row.lines[lineIndex];if(!line||!confirm('Remove this line? References to it will become End.'))return;row.lines.splice(lineIndex,1);for(const other of row.lines){if(other.next===line.id)other.next='';for(const choice of other.choices||[])if(choice.target===line.id)choice.target=''}if(row.start_line===line.id)row.start_line=row.lines[0]?.id||'';lineIndex=Math.max(0,lineIndex-1);changed();render()}
function linesEditor(row){const layout=document.createElement('div');layout.className='line-layout';const side=document.createElement('div');const list=document.createElement('div');list.className='line-list';row.lines.forEach((line,index)=>list.append(button((index+1)+'. '+(line.text||'(empty)').slice(0,45),()=>{lineIndex=index;render()},index===lineIndex?'active':'')));side.append(list,button('+ ADD LINE',()=>addLine(row)));layout.append(side);const form=document.createElement('div');form.className='form';const line=row.lines[lineIndex];if(!line){form.append(button('ADD FIRST LINE',()=>addLine(row)));layout.append(form);return layout}const order=document.createElement('div');order.className='row';for(const [title,offset] of [['↑',-1],['↓',1]]){const move=button(title,()=>{const next=lineIndex+offset;[row.lines[lineIndex],row.lines[next]]=[row.lines[next],row.lines[lineIndex]];lineIndex=next;changed();render()});move.disabled=lineIndex+offset<0||lineIndex+offset>=row.lines.length;order.append(move)}order.append(button('REMOVE LINE',()=>removeLine(row),'danger'));form.append(order,field('SPEAKER (OPTIONAL)',input(line.speaker,value=>line.speaker=value)),field('LINE TEXT',input(line.text,value=>line.text=value,true)),assetControl(line,'audio'));
if(kind==='dialog'){form.append(field('NEXT LINE / USED WHEN NO CHOICES',selectLine(line.next,value=>line.next=value)));const title=document.createElement('h3');title.textContent='Choices';form.append(title);const choices=document.createElement('div');choices.className='choices';line.choices.forEach((choice,index)=>{const rowChoice=document.createElement('div');rowChoice.className='choice';const label=input(choice.label,value=>choice.label=value);label.setAttribute('aria-label','Choice label');const target=selectLine(choice.target,value=>choice.target=value);target.setAttribute('aria-label','Choice target');rowChoice.append(label,target,button('REMOVE',()=>{line.choices.splice(index,1);changed();render()}));choices.append(rowChoice)});choices.append(button('+ ADD CHOICE',()=>{line.choices.push({label:'New choice',target:''});changed();render()}));form.append(choices)}
const advanced=document.createElement('details');const summary=document.createElement('summary');summary.textContent='LINE ID / ADVANCED';advanced.append(summary);const lineID=document.createElement('input');lineID.value=line.id;lineID.onchange=()=>{const previous=line.id;line.id=lineID.value;for(const other of row.lines){if(other.next===previous)other.next=line.id;for(const choice of other.choices||[])if(choice.target===previous)choice.target=line.id}if(row.start_line===previous)row.start_line=line.id;changed();render()};advanced.append(field('Stable line identifier',lineID));form.append(advanced);layout.append(form);return layout}
async function save(){if(busy)return;busy=true;document.querySelectorAll('.toolbar,.tabs,.workspace').forEach(n=>n.inert=true);el('save').disabled=true;status('Saving and exporting…');try{const result=await api('save',{database:state.database,revision:state.revision});state=result;dirty=false;el('save').textContent='SAVE + EXPORT';render();status('Saved. '+result.export.files+' managed files / '+result.export.assets+' media / '+result.export.removed+' unused files removed.')}catch(error){status(error.message,true)}finally{busy=false;document.querySelectorAll('.toolbar,.tabs,.workspace').forEach(n=>n.inert=false);el('save').disabled=false}}
async function openProject(path){if(dirty&&!confirm('Discard unsaved edits and open another project?'))return;try{state=await api('open',{path});dirty=false;selected='';lineIndex=0;el('project').value=state.project;el('save').textContent='SAVE + EXPORT';render();status('Opened '+state.project)}catch(error){status(error.message,true)}}
function showPreview(row){previewEntry=row;previewIndex=0;previewLine=null;el('preview-title').textContent=row.title;el('preview').showModal();if(kind==='notes'){el('preview-image').hidden=!row.image;if(row.image)el('preview-image').src=mediaURL(row.image);el('preview-text').textContent=row.text||'';el('preview-speaker').textContent='';el('preview-audio').hidden=true;el('preview-choices').replaceChildren();el('preview-next').hidden=true}else renderPreview(kind==='dialog'?row.start_line:null)}
function renderPreview(id){const audio=el('preview-audio');audio.pause();audio.removeAttribute('src');el('preview-image').hidden=true;previewLine=kind==='dialog'?previewEntry.lines.find(x=>x.id===id):previewEntry.lines[previewIndex];el('preview-choices').replaceChildren();if(!previewLine){el('preview-text').textContent='End.';el('preview-speaker').textContent='';audio.hidden=true;el('preview-next').hidden=true;return}el('preview-text').textContent=previewLine.text;el('preview-speaker').textContent=previewLine.speaker;audio.hidden=!previewLine.audio;if(previewLine.audio){audio.src=mediaURL(previewLine.audio);audio.play().catch(()=>{})}el('preview-next').hidden=kind==='dialog'&&previewLine.choices.length>0;for(const choice of previewLine.choices||[])el('preview-choices').append(button(choice.label,()=>renderPreview(choice.target)));}
el('preview-next').onclick=()=>{if(kind==='dialog')renderPreview(previewLine.next);else{previewIndex++;renderPreview(null)}};el('preview-close').onclick=()=>el('preview').close();el('preview').addEventListener('close',()=>{el('preview-audio').pause();el('preview-audio').removeAttribute('src')});
el('new').onclick=()=>{const id=newID(kind==='notes'?'note_':kind==='dialog'?'conversation_':'flavor_',entries());const row={id,title:'New '+(kind==='dialog'?'conversation':kind==='notes'?'note':'flavor'),...(kind==='notes'?{text:'',image:''}:{start_line:'',lines:[]})};if(kind!=='notes'){const line=makeLine([]);row.lines.push(line);if(kind==='dialog')row.start_line=line.id}entries().push(row);selected=id;lineIndex=0;changed();render()};
el('delete').onclick=()=>{const row=entry();if(row&&confirm('Remove '+row.title+'? Unused exported files are removed on Save.')){state.database[kind]=entries().filter(x=>x!==row);selected='';changed();render()}};
document.querySelectorAll('[data-kind]').forEach(tab=>tab.onclick=()=>{kind=tab.dataset.kind;selected='';lineIndex=0;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b===tab));render()});el('search').oninput=renderList;el('save').onclick=save;el('open').onclick=()=>openProject(el('project').value);el('browse').onclick=async()=>{try{const result=await api('browse',{});if(result.path)await openProject(result.path)}catch(error){status(error.message,true)}};el('close').onclick=async()=>{if(dirty&&!confirm('Exit without saving your edits?'))return;try{await api('close',{});dirty=false;document.querySelectorAll('button,input,textarea,select').forEach(n=>n.disabled=true);status('Lexicon closed. You can close this tab.')}catch(error){status(error.message,true)}};
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});api('state').then(result=>{state=result;el('project').value=state.project;render();status(state.project?'Opened '+state.project:'Open a project to begin.')}).catch(error=>status(error.message,true));
</script></body></html>
